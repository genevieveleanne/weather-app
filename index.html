<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app-container">
      <form>
        <input
          type="search"
          placeholder="Enter a city"
          class="city-text-input"
          id=""
        />
        <input type="submit" value="Search" class="city-search-input" id="" />
      </form>

      <h1>Atlanta</h1>
      <ul class="flex-style">
        <li class="current-temperature">37</li>
        <li class="fahrenheit">F |</li>
        <li class="celsius">C</li>
      </ul>

      <p>Mon, Nov 3 | weather description</p>
      <p>with a humidity of 54%</p>
      <p>and a wind speed of 1.68 mph</p>

      <footer>
        Coded by Genevieve Leanne Dominguez 💙 Open-sourced on
        <a href="#" target="_blank">GitHub</a>
      </footer>
    </div>
  </body>
</html>
