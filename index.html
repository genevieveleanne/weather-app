<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Poiret+One&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app-container">
      <button class="my-location" id="my-location">My Location 📍</button>

      <form>
        <input
          type="search"
          placeholder="Enter a city"
          class="city-text-input"
          id="user-city-input"
        />
        <input type="submit" value="Search" class="city-search-input" />
      </form>

      <div class="weather-info-container">
        <h1></h1>
        <ul class="flex-style">
          <li class="current-temperature" id="current-temperature"></li>
          <li class="units">
            <span class="fahrenheit-link" id="fahrenheit-link"> F </span>
            |
          </li>
          <li class="units celsius-link" id="celsius-link">C</li>
        </ul>

        <p>
          <span id="date"></span>
          |
          <span id="weather-description"></span>
          <span id="weather-image"></span>
        </p>
        <p>
          with a humidity of
          <span id="humidity"></span>
        </p>
        <p>
          and a wind speed of
          <span id="wind-speed"></span>
        </p>
      </div>

      <div class="forecast-flex-style" id="forecast"></div>
    </div>

    <footer>
      Coded by Genevieve Leanne Dominguez 💙 Open-sourced on
      <a
        href="https://github.com/genevieveleanne/weather-app"
        class="github-link"
        target="_blank"
        >GitHub</a
      >
    </footer>

    <script src="app.js"></script>
  </body>
</html>
