<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Poiret+One&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app-container">
      <form>
        <input
          type="search"
          placeholder="Enter a city"
          class="city-text-input"
          id="user-city-input"
        />
        <input type="submit" value="Search" class="city-search-input" id="" />
      </form>

      <div class="weather-info-container">
        <h1></h1>
        <ul class="flex-style">
          <li class="current-temperature" id="current-temperature"></li>
          <li class="fahrenheit">F |</li>
          <li class="celsius">C</li>
        </ul>

        <p>
          <span id="date"></span>
          |
          <span id="weather-description"></span>
          <span id="weather-image"></span>
        </p>
        <p>
          with a humidity of
          <span id="humidity"></span>
        </p>
        <p>
          and a wind speed of
          <span id="wind-speed"></span>
        </p>
      </div>

      <footer>
        Coded by Genevieve Leanne Dominguez 💙 Open-sourced on
        <a href="#" class="github-link" target="_blank">GitHub</a>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
